services:
  - type: web
    name: ats-scorer-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SPACY_MODEL_PRIMARY
        value: en_core_web_sm
      - key: SPACY_MODEL_SECONDARY
        value: en_core_web_sm
      - key: SENTENCE_TRANSFORMER_MODEL
        value: paraphrase-MiniLM-L3-v2
